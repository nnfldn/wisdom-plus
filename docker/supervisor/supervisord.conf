[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:php-fpm]
command = php-fpm --nodaemonize
autorestart = true
priority = 10
stdout_logfile = /dev/stdout
stderr_logfile = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g 'daemon off;'
autorestart = true
priority = 20
stdout_logfile = /dev/stdout
stderr_logfile = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

[program:queue]
command = php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --backoff=5
user = www-data
autorestart = true
priority = 30
stopwaitsecs = 60
stdout_logfile = /dev/stdout
stderr_logfile = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

[program:scheduler]
; Loop tipis: jalankan schedule:run setiap 60 detik (alternatif cron).
command = /bin/sh -c "while true; do php /var/www/html/artisan schedule:run --no-interaction; sleep 60; done"
user = www-data
autorestart = true
priority = 40
stdout_logfile = /dev/stdout
stderr_logfile = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
